name: プレビュー

on:
  pull_request:

permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    # フォークからの PR ではシークレットが使えないので動かさない
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      # precompute.ts のあるページがあるときだけ（docs/adding-a-phenomenon.md）
      - name: Google Cloud の認証
        if: hashFiles('src/content/phenomena/*/precompute.ts') != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISPERSIVE_LAB }}
      - if: hashFiles('src/content/phenomena/*/precompute.ts') != ''
        uses: google-github-actions/setup-gcloud@v3
      - name: 事前計算
        if: hashFiles('src/content/phenomena/*/precompute.ts') != ''
        run: npm run precompute -- sync
      - name: ビルド
        run: npm run build
      - name: プレビューチャンネルへデプロイ（URL を PR にコメントする）
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISPERSIVE_LAB }}
          projectId: dispersive-lab
          expires: 7d
