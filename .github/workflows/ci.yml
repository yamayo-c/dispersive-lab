name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: 型チェック
        run: npm run check
      - name: テスト（数値検証を含む）
        run: npm test
      # precompute.ts のあるページがあるときだけ（docs/adding-a-phenomenon.md）
      - name: Google Cloud の認証
        if: hashFiles('src/content/phenomena/*/precompute.ts') != ''
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DISPERSIVE_LAB }}
      - if: hashFiles('src/content/phenomena/*/precompute.ts') != ''
        uses: google-github-actions/setup-gcloud@v3
      - name: 事前計算
        if: hashFiles('src/content/phenomena/*/precompute.ts') != ''
        run: npm run precompute -- sync
      - name: ビルド
        run: npm run build
